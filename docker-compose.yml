name: hookrelay

services:
  # ---- The app (production-like image, or hot-reload via 'dev' profile) ----
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "Host=db;Port=5432;Database=hookrelay;Username=hookrelay;Password=hookrelay"
      ASPNETCORE_ENVIRONMENT: Development
      Delivery__MaxAttempts: "6"
      Delivery__TimeoutSeconds: "10"
      Delivery__PollIntervalSeconds: "2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- Hot-reload dev server (run: docker compose --profile dev up dev) ----
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    environment:
      DATABASE_URL: "Host=db;Port=5432;Database=hookrelay;Username=hookrelay;Password=hookrelay"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy

  # ---- One-off dotnet CLI (no local SDK needed) ----
  # Usage: docker compose run --rm sdk dotnet build
  sdk:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    entrypoint: []
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    environment:
      DATABASE_URL: "Host=db;Port=5432;Database=hookrelay;Username=hookrelay;Password=hookrelay"
    depends_on:
      - db

  # ---- Local PostgreSQL ----
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  nuget-cache:
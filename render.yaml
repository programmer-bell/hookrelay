# Render Blueprint for HookRelay (free tier).
#   Launch:  New -> Blueprint  -> connect this repo -> Apply
#   The secret DATABASE_URL is created with a blank value; set it in the
#   dashboard after apply (Render Dashboard -> Environment), so no secrets
#   live in git history.
services:
  - type: web
    name: hookrelay
    runtime: docker
    repo: https://github.com/programmer-bell/hookrelay
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production